[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlog"
version = "0.1.0"
description = "Evidence-backed incident investigation with LangGraph"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2"]

[project.scripts]
sherlog = "sherlog.cli:main"

[tool.setuptools.packages.find]
include = ["sherlog*", "evals*"]

[tool.setuptools.package-data]
sherlog = ["data/*.json", "web/*"]
evals = ["cases.json"]
